# This workflow installs the latest version of Terraform CLI and configures the Terraform CLI configuration file
# with an API token for Terraform Cloud (app.terraform.io). On push/pull_requests to tf/dev runs a tf plan

name: AWS Setup

on:
  workflow_dispatch:
    inputs:
      manual_run:
        description: 'Manual Run'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - "*dev*"
  pull_request:
    branches:
      - "*dev*"

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
  TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_region: ${{ vars.AWS_RESOURCE_REGION }}
  TF_VAR_project: ${{ vars.PROJECT}}
  TF_VAR_owner: ${{ vars.OWNER}}
  TF_VAR_subnet_a_cidr: ${{ vars.SUBNET_A_CIDR }}
  TF_VAR_subnet_b_cidr: ${{ vars.SUBNET_B_CIDR }}
  TF_VAR_subnet_c_cidr: ${{ vars.SUBNET_C_CIDR }}
  TF_VAR_lambda_subnet_cidr: ${{ vars.LAMBDA_SUBNET_CIDR }}
  TF_VAR_msk_user: ${{ secrets.MSK_USER }}
  TF_VAR_msk_password: ${{ secrets.MSK_PASSWORD }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: development

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Set up Python to be able to install python dependencies
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    #     # Set up AWS credentials
    # - name: Configure AWS credentials
    #   uses: aws-actions/configure-aws-credentials@v2
    #   with:
    #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #     aws-region: ${{ vars.AWS_RESOURCE_REGION }}

    # Note if Manual Run
    - name: Manual Run
      if: ${{ inputs.manual_run == 'true' }}
      run: echo "Manual Run"

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform -chdir=Terraform init -reconfigure

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform -chdir=Terraform fmt -check

    # Install MSK-Image-Publisher Lambda Dependencies
    - name: Install MSK-Image-Publisher Lambda Dependencies
      run: npm --prefix Source/Lambdas/MSK-Image-Publisher-Node/ install

    # Install S3-Image-Publisher Python Lambda Dependencies
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Source/Lambdas/MSK-Image-Publisher-Python/requirements.txt -t Source/Lambdas/MSK-Image-Publisher-Python

    # Validate Terraform
    - name: Terraform Validate
      run: terraform -chdir=Terraform validate

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform -chdir=Terraform plan

    # Build or change infrastructure according to Terraform configuration files
    - name: Terraform Apply
      run: terraform -chdir=Terraform apply -auto-approve

    # # Capture Terraform Outputs
